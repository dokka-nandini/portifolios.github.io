<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Dokka Nandini</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function () { try { var t = localStorage.getItem('dn-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <main id="main" style="position:relative;overflow:hidden">
    <div class="ambient" aria-hidden="true"><div class="ambient__blob ambient__blob--a"></div><div class="ambient__blob ambient__blob--b"></div><div class="ambient__grid"></div></div>
    <div class="notfound" style="position:relative">
      <div>
        <span class="eyebrow"><span class="eyebrow__dot"></span>Error 404</span>
        <h1 style="margin-top:20px">This page <em class="serif grad-text">wandered off.</em></h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a class="btn btn--primary btn--lg" href="/">Back to home</a>
      </div>
    </div>
  </main>
</body>
</html>
