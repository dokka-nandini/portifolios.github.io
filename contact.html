  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="contact">
  <main id="main">
    <section class="page-head">
      <div class="ambient" aria-hidden="true"><div class="ambient__blob ambient__blob--a"></div><div class="ambient__blob ambient__blob--b"></div><div class="ambient__grid"></div></div>
      <div class="container">
        <span class="eyebrow" data-rise><span class="eyebrow__dot"></span>Contact</span>
        <h1 class="page-head__title" data-rise style="--d:.08s">Let&rsquo;s build something <em class="serif grad-text">meaningful.</em></h1>
        <p class="page-head__sub" data-rise style="--d:.16s">Have an interesting idea, an opportunity, or a project in mind? I&rsquo;d love to connect.</p>
        <a class="mega-link" href="mailto:nandini.programmer@gmail.com" data-rise style="--d:.24s"><span>nandini.programmer@gmail.com</span><svg class="i"><use href="#i-arrow-up-right"/></svg></a>
      </div>
    </section>

    <section class="section section--tight" aria-label="Contact details and form">
      <div class="container contact__grid">
        <ul class="contact__methods" id="contact-methods"></ul>
        <form class="contact-form spotlight" id="contact-form" data-reveal novalidate>
          <div class="field"><label for="cf-name">Your name</label><input id="cf-name" name="name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="cf-email">Your email</label><input id="cf-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="cf-message">Message</label><textarea id="cf-message" name="message" rows="6" required></textarea></div>
          <div class="contact-form__foot">
            <p class="form-status" role="status" aria-live="polite"></p>
            <button class="btn btn--primary btn--lg" type="submit">Send Message <svg class="i i--move"><use href="#i-send"/></svg></button>
          </div>
          <p class="form-note">Opens your email app with the message ready to send.</p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
</body>
</html>
